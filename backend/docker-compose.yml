# Selah / UIVSBE — local / self-hosted stack (sanitized for open source)
# Copy .env.example → .env and fill in your own values before starting.

services:
  db:
    image: postgres:14-alpine
    container_name: selah_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selah}
      POSTGRES_USER: ${POSTGRES_USER:-selah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - selah_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: selah_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - selah_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selah_web
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-selah}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selah}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - selah_net
    restart: unless-stopped
    # Prefer putting the app behind nginx; expose only if debugging locally:
    # ports:
    #   - "8000:8000"

  nginx:
    image: nginx:1.25-alpine
    container_name: selah_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment and mount your own certs for HTTPS:
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../page:/app/page:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
      # TLS (optional — place your own files, never commit real certs):
      # - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - web
    networks:
      - selah_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  selah_net:
    driver: bridge
