# HTTP reverse proxy + H5 static (Selah / Manna / admin). Customize server_name for your domain.
upstream selah_web {
    server web:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name localhost;
    charset utf-8;
    client_max_body_size 100M;

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Django collectstatic (optional)
    location /django-static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # Selah H5 static assets
    location /static/ {
        alias /app/page/static_selah/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /bible-media/ {
        proxy_pass http://selah_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /legal/ {
        proxy_pass http://selah_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://selah_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /admin/ {
        alias /app/page/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        alias /app/page/admin/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Default: Selah H5
    location / {
        root /app/page/selah;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        alias /app/page/selah/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

